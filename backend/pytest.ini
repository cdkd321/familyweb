[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Add backend/ to pythonpath to help with imports
pythonpath = . backend
env =
    FLASK_ENV=testing
    # For testing, we'll aim to use an in-memory SQLite database
    # This will be configured in the app factory when FLASK_ENV is 'testing'
    # DATABASE_URL=sqlite:///:memory: 
    # JWT_SECRET_KEY can also be overridden in app factory for testing
    # JWT_SECRET_KEY=test_jwt_secret_key_for_pytest
    # SECRET_KEY=test_flask_secret_key_for_pytest
